services:
  - type: web
    name: quiz-assessment-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URL
        sync: false
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: MASTER_ADMIN_PATH
        value: admin-suryansh-akriti
      - key: ADMIN_TOTP_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_SESSION_HOURS
        value: "8"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CODE_RUNNER_URL
        sync: false
      - key: CODE_RUNNER_API_KEY
        sync: false
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
